<script>
  // ── DOM refs ─────────────────────────────────────────────
  const editor   = document.getElementById('editor');
  const statsEl  = document.getElementById('stats');
  const titleEl  = document.getElementById('noteTitle');
  const toastEl  = document.getElementById('toast');
  const treeEl   = document.getElementById('tree');
  const sidebar  = document.getElementById('sidebar');
  const ctxMenu  = document.getElementById('ctxMenu');
  const editorWrap  = document.getElementById('editorWrap');
  const previewPane = document.getElementById('previewPane');
  const gutter      = document.getElementById('gutter');
  const hlLayer     = document.getElementById('hlLayer');
  const hlCode      = document.getElementById('hlCode');
  const codeOutput  = document.getElementById('codeOutput');
  const langSelect  = document.getElementById('langSelect');

  const FONTS = {
    sans:     '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
    serif:    'Georgia, "Times New Roman", serif',
    mono:     '"SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace',
    rounded:     '"Comfortaa", "SF Pro Rounded", "Arial Rounded MT Bold", -apple-system, sans-serif',
    cursive:     '"Dancing Script", "Snell Roundhand", "Apple Chancery", "Segoe Script", cursive',
    handwriting: '"Caveat", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive',
    book:        '"Lora", Georgia, "Times New Roman", serif'
  };

  // ── State ─────────────────────────────────────────────────
  let activeFolderId = null; // folder context for new notes
  let selectMode = false;                 // bulk-selection mode
  const selectedNotes = new Set();        // ids of selected notes

  // ── Storage ───────────────────────────────────────────────
  const loadNotes   = () => { try { return JSON.parse(localStorage.getItem('quillpad_notes'))   || []; } catch { return []; } };
  const loadFolders = () => { try { return JSON.parse(localStorage.getItem('quillpad_folders')) || []; } catch { return []; } };
  const saveNotes   = (n, silent) => {
    localStorage.setItem('quillpad_notes', JSON.stringify(n));
    if (!silent) { localStorage.setItem('quillpad_lastEdit', Date.now().toString()); updateLastEdit(); }
  };
  const saveFolders = f  => localStorage.setItem('quillpad_folders', JSON.stringify(f));
  const getActiveId = () => localStorage.getItem('quillpad_activeId');
  const setActiveId = id => localStorage.setItem('quillpad_activeId', id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // ── Tree render ───────────────────────────────────────────
  function renderTree() {
    const notes    = loadNotes();
    const folders  = loadFolders();
    const activeId = getActiveId();
    treeEl.innerHTML = '';

    if (!notes.length && !folders.length) {
      treeEl.innerHTML = '<div class="sidebar-empty">No notes yet.<br>Hit + to get started.</div>';
      return;
    }

    // Render top-level folders (each recurses into its subfolders)
    childFolders(folders, null).forEach(folder => {
      treeEl.appendChild(buildFolderWrap(folder, 0, folders, notes, activeId));
    });

    // Unfiled notes
    const unfiled = notes
      .filter(n => !n.folderId)
      .sort((a, b) => b.updatedAt - a.updatedAt);

    if (unfiled.length > 0) {
      if (folders.length > 0) {
        const lbl = document.createElement('div');
        lbl.className = 'section-label';
        lbl.textContent = 'Unfiled';
        treeEl.appendChild(lbl);
      }
      unfiled.forEach(note => treeEl.appendChild(buildNoteItem(note, false, activeId)));
    }
  }

  // Folders whose parent is parentId (null = top level)
  const childFolders = (folders, parentId) =>
    folders.filter(f => (f.parentId || null) === (parentId || null));

  // All descendant folder ids of rootId (not including rootId)
  function descendantFolderIds(folders, rootId) {
    const out = [];
    const stack = [rootId];
    while (stack.length) {
      const pid = stack.pop();
      folders.forEach(f => { if ((f.parentId || null) === pid) { out.push(f.id); stack.push(f.id); } });
    }
    return out;
  }

  function buildFolderWrap(folder, depth, folders, notes, activeId) {
    const folderNotes = notes
      .filter(n => n.folderId === folder.id)
      .sort((a, b) => b.updatedAt - a.updatedAt);
    const subFolders = childFolders(folders, folder.id);

    const wrap = document.createElement('div');
    wrap.className = 'folder-wrap' + (folder.collapsed ? '' : ' open');
    wrap.dataset.folderId = folder.id;

    // Folder row
    const row = document.createElement('div');
    row.className = 'folder-row' + (activeFolderId === folder.id ? ' active-folder' : '');
    row.dataset.folderId = folder.id;
    row.style.paddingLeft = (6 + depth * 14) + 'px';
    row.innerHTML = `
        <span class="chevron">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
        <span class="folder-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </span>
        <span class="folder-name-text">${escHtml(folder.name || 'Untitled Folder')}</span>
        <span class="folder-row-actions">
          <button class="row-btn" data-action="rename-folder" data-id="${folder.id}" title="Rename">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="row-btn danger" data-action="delete-folder" data-id="${folder.id}" title="Delete folder">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </span>`;

      // Toggle expand
      row.addEventListener('click', e => {
        if (e.target.closest('[data-action]')) return;
        activeFolderId = folder.id;
        wrap.classList.toggle('open');
        const folders2 = loadFolders();
        const fi = folders2.findIndex(f => f.id === folder.id);
        if (fi !== -1) { folders2[fi].collapsed = !wrap.classList.contains('open'); saveFolders(folders2); }
        renderTree();
      });

      // Rename button
      row.querySelector('[data-action="rename-folder"]').addEventListener('click', e => {
        e.stopPropagation(); startFolderRename(folder.id, row);
      });

      // Delete button
      row.querySelector('[data-action="delete-folder"]').addEventListener('click', e => {
        e.stopPropagation(); deleteFolder(folder.id);
      });

      // Right-click
      row.addEventListener('contextmenu', e => { e.preventDefault(); showFolderCtx(e, folder.id); });

      // Drag the folder itself (to nest it under another folder)
      row.draggable = true;
      row.addEventListener('dragstart', e => {
        e.stopPropagation();
        e.dataTransfer.setData('folderId', folder.id);
        row.style.opacity = '0.5';
      });
      row.addEventListener('dragend', () => { row.style.opacity = ''; });

      // Drag-over for dropping notes or folders
      row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', e => {
        e.preventDefault(); e.stopPropagation(); row.classList.remove('drag-over');
        const noteId = e.dataTransfer.getData('noteId');
        if (noteId) { moveNoteToFolder(noteId, folder.id); return; }
        const dropFolderId = e.dataTransfer.getData('folderId');
        if (dropFolderId) moveFolderToParent(dropFolderId, folder.id);
      });

      // Double-click name to rename
      row.querySelector('.folder-name-text').addEventListener('dblclick', e => {
        e.stopPropagation(); startFolderRename(folder.id, row);
      });

      wrap.appendChild(row);

      // Children: subfolders first (recursive), then notes
      const children = document.createElement('div');
      children.className = 'folder-children';
      subFolders.forEach(sub => children.appendChild(buildFolderWrap(sub, depth + 1, folders, notes, activeId)));
      folderNotes.forEach(note => children.appendChild(buildNoteItem(note, true, activeId, depth)));
      wrap.appendChild(children);

    return wrap;
  }

  function buildNoteItem(note, indented, activeId, depth = 0) {
    const item = document.createElement('div');
    const isSel = selectMode && selectedNotes.has(note.id);
    item.className = 'note-item' + (indented ? ' indented' : '') + (note.id === activeId ? ' active' : '') + (isSel ? ' selected' : '');
    item.dataset.noteId = note.id;
    item.draggable = !selectMode;
    if (indented && depth > 0) item.style.paddingLeft = (28 + depth * 14) + 'px';

    const fileGlyph = note.mode === 'code'
      ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>`
      : `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
    const checkbox = selectMode ? `
      <span class="note-check">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>` : `
      <span class="note-file-icon">${fileGlyph}</span>`;

    item.innerHTML = `${checkbox}
      <div class="note-item-body">
        <div class="note-item-title">${escHtml(note.title || 'Untitled note')}</div>
        <div class="note-item-date">${formatDate(note.updatedAt)}</div>
      </div>
      <span class="note-item-actions">
        <button class="row-btn danger" data-action="delete-note" data-id="${note.id}" title="Delete note">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </span>`;

    item.addEventListener('click', e => {
      if (e.target.closest('[data-action]')) return;
      if (selectMode) { toggleNoteSelection(note.id, item); return; }
      switchNote(note.id);
    });

    item.querySelector('[data-action="delete-note"]').addEventListener('click', e => {
      e.stopPropagation(); confirmDeleteNote(note.id);
    });

    item.addEventListener('contextmenu', e => { e.preventDefault(); showNoteCtx(e, note.id); });

    // Drag
    item.addEventListener('dragstart', e => {
      e.dataTransfer.setData('noteId', note.id);
      item.style.opacity = '0.5';
    });
    item.addEventListener('dragend', () => { item.style.opacity = ''; });

    return item;
  }

  // ── Inline folder rename ──────────────────────────────────
  function startFolderRename(folderId, row) {
    const nameEl = row.querySelector('.folder-name-text');
    const folders = loadFolders();
    const folder = folders.find(f => f.id === folderId);
    if (!folder) return;

    const input = document.createElement('input');
    input.className = 'folder-name-input';
    input.value = folder.name;
    nameEl.replaceWith(input);
    input.focus(); input.select();

    const commit = () => {
      const val = input.value.trim() || 'Untitled Folder';
      const fs = loadFolders();
      const fi = fs.findIndex(f => f.id === folderId);
      if (fi !== -1) { fs[fi].name = val; saveFolders(fs); }
      renderTree();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { renderTree(); }
    });
  }

  // ── Context menus ─────────────────────────────────────────
  function showNoteCtx(e, noteId) {
    const folders = loadFolders();
    const notes   = loadNotes();
    const note    = notes.find(n => n.id === noteId);
    if (!note) return;

    let html = '';

    if (folders.length) {
      html += `<div class="ctx-section-title">Move to folder</div>`;
      if (note.folderId) {
        html += `<div class="ctx-item" data-action="move" data-note="${noteId}" data-folder="">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Remove from folder</div>`;
      }
      // Walk the folder tree depth-first so subfolders appear indented under their parent
      (function walk(parentId, depth) {
        childFolders(folders, parentId).forEach(f => {
          const active = note.folderId === f.id;
          html += `<div class="ctx-item${active ? ' active' : ''}" data-action="move" data-note="${noteId}" data-folder="${f.id}" style="padding-left:${10 + depth * 14}px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            ${escHtml(f.name)}${active ? ' ✓' : ''}</div>`;
          walk(f.id, depth + 1);
        });
      })(null, 0);
      html += `<div class="ctx-separator"></div>`;
    }

    html += `<div class="ctx-item danger" data-action="delete-note-ctx" data-id="${noteId}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Delete note</div>`;

    openCtxMenu(e.clientX, e.clientY, html);
  }

  function showFolderCtx(e, folderId) {
    const html = `
      <div class="ctx-item" data-action="new-note-in" data-folder="${folderId}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New note here</div>
      <div class="ctx-item" data-action="new-subfolder" data-folder="${folderId}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        New subfolder</div>
      <div class="ctx-item" data-action="rename-folder-ctx" data-id="${folderId}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Rename</div>
      <div class="ctx-separator"></div>
      <div class="ctx-item danger" data-action="delete-folder-ctx" data-id="${folderId}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Delete folder</div>`;
    openCtxMenu(e.clientX, e.clientY, html);
  }

  function openCtxMenu(x, y, html) {
    ctxMenu.innerHTML = html;
    ctxMenu.classList.add('visible');

    // Position
    const vw = window.innerWidth, vh = window.innerHeight;
    ctxMenu.style.left = '0'; ctxMenu.style.top = '0';
    const w = ctxMenu.offsetWidth, h = ctxMenu.offsetHeight;
    ctxMenu.style.left = Math.min(x, vw - w - 8) + 'px';
    ctxMenu.style.top  = Math.min(y, vh - h - 8) + 'px';

    ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
      item.addEventListener('click', e => {
        e.stopPropagation();
        const action = item.dataset.action;
        if (action === 'move')              moveNoteToFolder(item.dataset.note, item.dataset.folder || null);
        if (action === 'delete-note-ctx')   confirmDeleteNote(item.dataset.id);
        if (action === 'rename-folder-ctx') { closeCtxMenu(); const row = treeEl.querySelector(`.folder-row[data-folder-id="${item.dataset.id}"]`); if (row) startFolderRename(item.dataset.id, row); }
        if (action === 'delete-folder-ctx') deleteFolder(item.dataset.id);
        if (action === 'new-note-in')       newNoteInFolder(item.dataset.folder);
        if (action === 'new-subfolder')     createFolder(item.dataset.folder);
        closeCtxMenu();
      });
    });
  }

  function closeCtxMenu() { ctxMenu.classList.remove('visible'); }
  document.addEventListener('click', closeCtxMenu);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCtxMenu(); });

  // ── Folder CRUD ───────────────────────────────────────────
  function createFolder(parentId) {
    const folder = { id: uid(), name: parentId ? 'New Subfolder' : 'New Folder', collapsed: false, parentId: parentId || null };
    const folders = loadFolders();
    // Make sure the parent is expanded so the new subfolder is visible
    if (parentId) {
      const pi = folders.findIndex(f => f.id === parentId);
      if (pi !== -1) folders[pi].collapsed = false;
    }
    folders.push(folder);
    saveFolders(folders);
    activeFolderId = folder.id;
    renderTree();
    // Auto-start rename
    setTimeout(() => {
      const row = treeEl.querySelector(`.folder-row[data-folder-id="${folder.id}"]`) ||
                  [...treeEl.querySelectorAll('.folder-row')].find(r => r.dataset.folderId === folder.id);
      if (row) startFolderRename(folder.id, row);
    }, 50);
  }

  document.getElementById('newFolderBtn').addEventListener('click', () => createFolder(null));

  async function deleteFolder(folderId) {
    const folders = loadFolders();
    const doomed = [folderId, ...descendantFolderIds(folders, folderId)];
    const hasSub = doomed.length > 1;
    const ok = await confirmDialog({
      title: hasSub ? 'Delete folder and subfolders?' : 'Delete this folder?',
      message: hasSub
        ? 'This folder and its subfolders will be removed. Notes inside will be moved to Unfiled.'
        : 'The folder will be removed. Notes inside will be moved to Unfiled.',
      confirmText: 'Delete'
    });
    if (!ok) return;
    saveFolders(folders.filter(f => !doomed.includes(f.id)));
    // Move notes from any deleted folder to unfiled
    const notes = loadNotes();
    notes.forEach(n => { if (doomed.includes(n.folderId)) n.folderId = null; });
    saveNotes(notes);
    if (doomed.includes(activeFolderId)) activeFolderId = null;
    renderTree();
    showToast('Folder deleted, notes moved to Unfiled.');
  }

  function moveFolderToParent(folderId, parentId) {
    if (folderId === parentId) return;
    const folders = loadFolders();
    // Prevent nesting a folder inside itself or one of its own descendants
    if (parentId && descendantFolderIds(folders, folderId).includes(parentId)) {
      showToast("Can't move a folder into its own subfolder.");
      return;
    }
    const fi = folders.findIndex(f => f.id === folderId);
    if (fi === -1) return;
    if ((folders[fi].parentId || null) === (parentId || null)) return;
    folders[fi].parentId = parentId || null;
    // Open the destination so the moved folder is visible
    if (parentId) {
      const pi = folders.findIndex(f => f.id === parentId);
      if (pi !== -1) folders[pi].collapsed = false;
    }
    saveFolders(folders);
    renderTree();
    showToast('Folder moved.');
  }

  function moveNoteToFolder(noteId, folderId) {
    const notes = loadNotes();
    const idx = notes.findIndex(n => n.id === noteId);
    if (idx === -1) return;
    notes[idx].folderId = folderId || null;
    saveNotes(notes);
    // Auto-open destination folder
    if (folderId) {
      const folders = loadFolders();
      const fi = folders.findIndex(f => f.id === folderId);
      if (fi !== -1) { folders[fi].collapsed = false; saveFolders(folders); }
    }
    renderTree();
    showToast(folderId ? 'Note moved.' : 'Note moved to Unfiled.');
  }

  // ── Manage overlay (notes & folders) ──────────────────────
  const manageOverlay = document.getElementById('manageOverlay');
  const manageBody    = document.getElementById('manageBody');
  const manageSearch  = document.getElementById('manageSearch');
  const FOLDER_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
  const RENAME_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
  const TRASH_SVG  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;

  function openManage() {
    manageSearch.value = '';
    manageOverlay.classList.add('show');
    renderManage();
  }
  function closeManage() { manageOverlay.classList.remove('show'); }

  // Build the folder <select> options (hierarchy indented) for a note's current folder
  function folderOptions(folders, selected) {
    let html = `<option value=""${!selected ? ' selected' : ''}>Unfiled</option>`;
    (function walk(parentId, depth) {
      childFolders(folders, parentId).forEach(f => {
        const pad = '  '.repeat(depth);
        html += `<option value="${f.id}"${selected === f.id ? ' selected' : ''}>${pad}${escHtml(f.name)}</option>`;
        walk(f.id, depth + 1);
      });
    })(null, 0);
    return html;
  }

  function renderManage() {
    const folders = loadFolders();
    const notes = loadNotes();
    const q = manageSearch.value.trim().toLowerCase();
    let html = '';

    // Folders section
    html += `<div class="manage-section-title">Folders <span class="count">${folders.length}</span>
      <button class="manage-add" data-add-folder>+ New folder</button></div>`;
    if (!folders.length) {
      html += `<div class="manage-empty">No folders yet.</div>`;
    } else {
      (function walk(parentId, depth) {
        childFolders(folders, parentId).forEach(f => {
          const count = notes.filter(n => n.folderId === f.id).length;
          const subs = childFolders(folders, f.id).length;
          const meta = [count ? `${count} note${count !== 1 ? 's' : ''}` : '', subs ? `${subs} sub` : ''].filter(Boolean).join(' · ');
          html += `<div class="manage-row folder" style="padding-left:${10 + depth * 16}px">
            <span class="m-icon">${FOLDER_SVG}</span>
            <span class="manage-name" data-rename-folder="${f.id}">${escHtml(f.name)}</span>
            <span class="manage-sub">${meta}</span>
            <span class="manage-actions">
              <button class="row-btn" data-rename-folder="${f.id}" title="Rename">${RENAME_SVG}</button>
              <button class="row-btn danger" data-del-folder="${f.id}" title="Delete folder">${TRASH_SVG}</button>
            </span></div>`;
          walk(f.id, depth + 1);
        });
      })(null, 0);
    }

    // Notes section
    let list = notes.slice().sort((a, b) => b.updatedAt - a.updatedAt);
    if (q) list = list.filter(n => (n.title || '').toLowerCase().includes(q) || (n.content || '').toLowerCase().includes(q));
    html += `<div class="manage-section-title">Notes <span class="count">${list.length}${q ? ' found' : ''}</span></div>`;
    if (!list.length) {
      html += `<div class="manage-empty">${q ? 'No notes match your search.' : 'No notes yet.'}</div>`;
    } else {
      list.forEach(n => {
        html += `<div class="manage-row note">
          <span class="m-icon">${n.mode === 'code'
            ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>`
            : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`}</span>
          <span class="manage-name" data-open-note="${n.id}">${escHtml(n.title || 'Untitled note')}</span>
          <select class="manage-move" data-move-note="${n.id}">${folderOptions(folders, n.folderId || '')}</select>
          <span class="manage-actions">
            <button class="row-btn danger" data-del-note="${n.id}" title="Delete note">${TRASH_SVG}</button>
          </span></div>`;
      });
    }

    manageBody.innerHTML = html;
  }

  // Delegated handlers for the manage body
  manageBody.addEventListener('click', async e => {
    const t = e.target.closest('[data-add-folder],[data-rename-folder],[data-del-folder],[data-open-note],[data-del-note]');
    if (!t) return;
    if (t.hasAttribute('data-add-folder')) { createFolder(null); renderManage(); return; }
    if (t.hasAttribute('data-open-note'))  { switchNote(t.dataset.openNote); closeManage(); return; }
    if (t.hasAttribute('data-del-note'))   { await confirmDeleteNote(t.dataset.delNote); renderManage(); return; }
    if (t.hasAttribute('data-del-folder')) { await deleteFolder(t.dataset.delFolder); renderManage(); return; }
    if (t.hasAttribute('data-rename-folder')) {
      const folders = loadFolders();
      const f = folders.find(x => x.id === t.dataset.renameFolder);
      if (!f) return;
      const name = await promptDialog({ title: 'Rename folder', message: 'Enter a new folder name.', value: f.name, confirmText: 'Rename', icon: 'save' });
      if (name) { f.name = name; saveFolders(folders); renderTree(); renderManage(); }
    }
  });
  manageBody.addEventListener('change', e => {
    const sel = e.target.closest('[data-move-note]');
    if (sel) { moveNoteToFolder(sel.dataset.moveNote, sel.value || null); renderManage(); }
  });

  document.getElementById('manageBtn').addEventListener('click', openManage);
  document.getElementById('manageClose').addEventListener('click', closeManage);
  manageOverlay.addEventListener('mousedown', e => { if (e.target === manageOverlay) closeManage(); });
  manageSearch.addEventListener('input', renderManage);
  document.addEventListener('keydown', e => {
    // Don't close Manage if a confirm/prompt modal is stacked on top of it
    if (e.key === 'Escape' && manageOverlay.classList.contains('show')
        && !document.getElementById('modalOverlay').classList.contains('show')) closeManage();
  });

  // ── Note CRUD ─────────────────────────────────────────────
  function newNoteInFolder(folderId) {
    const note = { id: uid(), title: '', content: '', folderId: folderId || null, updatedAt: Date.now() };
    const notes = loadNotes();
    notes.unshift(note);
    saveNotes(notes);
    // Ensure folder is open
    if (folderId) {
      const folders = loadFolders();
      const fi = folders.findIndex(f => f.id === folderId);
      if (fi !== -1 && folders[fi].collapsed) { folders[fi].collapsed = false; saveFolders(folders); }
    }
    switchNote(note.id);
  }

  document.getElementById('newNoteBtn').addEventListener('click', () => {
    newNoteInFolder(null);   // new notes are always Unfiled; use "New note here" to file into a folder
  });

  function switchNote(id) {
    setActiveId(id);
    const note = loadNotes().find(n => n.id === id);
    if (!note) return;
    titleEl.value  = note.title;
    editor.value   = note.content;
    activeFolderId = note.folderId || null;
    undoStack = []; lastTypeSnap = 0; refreshUndoBtn();  // history is per-note
    applyMode(note.mode === 'code' ? 'code' : 'notes', note.lang);  // mode is per-note
    renderTree();
    editor.focus();
    if (isMobile()) setSidebar(false);   // picking a note closes the slide-over
  }

  function saveActive() {
    const id = getActiveId(); if (!id) return;
    const notes = loadNotes();
    const idx = notes.findIndex(n => n.id === id); if (idx === -1) return;
    const hadContentBefore = (notes[idx].title || '').trim() || (notes[idx].content || '').trim();
    notes[idx].title     = titleEl.value;
    notes[idx].content   = editor.value;
    notes[idx].updatedAt = Date.now();
    saveNotes(notes);
    renderTree();
    const hasContentNow = (titleEl.value || '').trim() || (editor.value || '').trim();
    if (!!hadContentBefore !== !!hasContentNow) updateBackupStatus();
    updatePreview();
  }

  editor.addEventListener('input',  () => { updateStats(); saveActive(); });
  titleEl.addEventListener('input', saveActive);
  // Tab from the title jumps straight into the note body (skip toolbar buttons)
  titleEl.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); editor.focus(); }
  });

  async function confirmDeleteNote(id) {
    const note = loadNotes().find(n => n.id === id);
    if (!note) return;
    const label = (note.title || '').trim();
    const ok = await confirmDialog({
      title: label ? `Delete "${label}"?` : 'Delete this note?',
      message: "This can't be undone.",
      confirmText: 'Delete'
    });
    if (!ok) return;
    deleteNote(id);
  }

  function deleteNote(id) {
    let notes = loadNotes();
    if (notes.length === 1) {
      const fresh = { id: uid(), title: '', content: '', folderId: null, updatedAt: Date.now() };
      saveNotes([fresh]); switchNote(fresh.id); showToast('Note cleared.'); return;
    }
    notes = notes.filter(n => n.id !== id); saveNotes(notes);
    if (getActiveId() === id) {
      const sorted = [...notes].sort((a, b) => b.updatedAt - a.updatedAt);
      switchNote(sorted[0].id);
    } else { renderTree(); }
    showToast('Note deleted.');
  }

  document.getElementById('clearBtn').addEventListener('click', async () => {
    const id = getActiveId(); if (!id) return;
    const note = loadNotes().find(n => n.id === id);
    if (note?.title || note?.content) {
      const label = (note.title || '').trim();
      const ok = await confirmDialog({
        title: label ? `Delete "${label}"?` : 'Delete this note?',
        message: "This can't be undone.",
        confirmText: 'Delete'
      });
      if (!ok) return;
    }
    deleteNote(id);
  });

  // ── Multi-select (bulk move / delete) ─────────────────────
  const bulkBar   = document.getElementById('bulkBar');
  const bulkCount = document.getElementById('bulkCount');

  function setSelectMode(on) {
    selectMode = on;
    selectedNotes.clear();
    sidebar.classList.toggle('selecting', on);
    document.getElementById('selectBtn').classList.toggle('active-btn', on);
    renderTree();
    updateBulkBar();
  }

  function toggleNoteSelection(id, item) {
    if (selectedNotes.has(id)) { selectedNotes.delete(id); item.classList.remove('selected'); }
    else { selectedNotes.add(id); item.classList.add('selected'); }
    updateBulkBar();
  }

  function updateBulkBar() {
    const n = selectedNotes.size;
    bulkCount.textContent = n === 1 ? '1 selected' : `${n} selected`;
    document.getElementById('bulkMove').disabled = n === 0;
    document.getElementById('bulkDelete').disabled = n === 0;
  }

  document.getElementById('selectBtn').addEventListener('click', () => setSelectMode(!selectMode));
  document.getElementById('bulkCancel').addEventListener('click', () => setSelectMode(false));

  document.getElementById('bulkSelectAll').addEventListener('click', () => {
    const all = loadNotes();
    const allSelected = all.length > 0 && all.every(n => selectedNotes.has(n.id));
    selectedNotes.clear();
    if (!allSelected) all.forEach(n => selectedNotes.add(n.id));
    renderTree();
    updateBulkBar();
  });

  document.getElementById('bulkDelete').addEventListener('click', async () => {
    const ids = [...selectedNotes];
    if (!ids.length) return;
    const ok = await confirmDialog({
      title: `Delete ${ids.length} note${ids.length !== 1 ? 's' : ''}?`,
      message: "This can't be undone.",
      confirmText: `Delete ${ids.length}`
    });
    if (!ok) return;
    let notes = loadNotes().filter(n => !selectedNotes.has(n.id));
    if (notes.length === 0) {
      const fresh = { id: uid(), title: '', content: '', folderId: null, updatedAt: Date.now() };
      notes = [fresh];
    }
    saveNotes(notes);
    if (!notes.find(n => n.id === getActiveId())) {
      const sorted = [...notes].sort((a, b) => b.updatedAt - a.updatedAt);
      setActiveId(sorted[0].id);
    }
    showToast(`${ids.length} note${ids.length !== 1 ? 's' : ''} deleted.`);
    setSelectMode(false);
    switchNote(getActiveId());
    updateBackupStatus();
  });

  document.getElementById('bulkMove').addEventListener('click', e => {
    if (!selectedNotes.size) return;
    const folders = loadFolders();
    let html = `<div class="ctx-section-title">Move ${selectedNotes.size} note${selectedNotes.size !== 1 ? 's' : ''} to</div>`;
    html += `<div class="ctx-item" data-bulk-folder="">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Unfiled</div>`;
    (function walk(parentId, depth) {
      childFolders(folders, parentId).forEach(f => {
        html += `<div class="ctx-item" data-bulk-folder="${f.id}" style="padding-left:${10 + depth * 14}px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          ${escHtml(f.name)}</div>`;
        walk(f.id, depth + 1);
      });
    })(null, 0);

    const rect = e.currentTarget.getBoundingClientRect();
    openCtxMenu(rect.left, rect.top, html);
    ctxMenu.querySelectorAll('[data-bulk-folder]').forEach(el => {
      el.addEventListener('click', ev => {
        ev.stopPropagation();
        bulkMoveTo(el.dataset.bulkFolder || null);
        closeCtxMenu();
      });
    });
  });

  function bulkMoveTo(folderId) {
    const notes = loadNotes();
    let count = 0;
    notes.forEach(n => { if (selectedNotes.has(n.id)) { n.folderId = folderId || null; count++; } });
    saveNotes(notes);
    if (folderId) {
      const folders = loadFolders();
      const fi = folders.findIndex(f => f.id === folderId);
      if (fi !== -1) { folders[fi].collapsed = false; saveFolders(folders); }
    }
    showToast(`${count} note${count !== 1 ? 's' : ''} moved.`);
    setSelectMode(false);
  }

  // ── Sidebar toggle ────────────────────────────────────────
  const isMobile = () => window.matchMedia('(max-width: 700px)').matches;
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');

  function setSidebar(open) {
    sidebar.classList.toggle('collapsed', !open);
    sidebarBackdrop.classList.toggle('show', open && isMobile());
  }
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    setSidebar(sidebar.classList.contains('collapsed'));
  });
  sidebarBackdrop.addEventListener('click', () => setSidebar(false));
  // Keep the backdrop honest if the window is resized across the breakpoint
  window.addEventListener('resize', () => {
    if (!isMobile()) sidebarBackdrop.classList.remove('show');
  });

  // ── Stats ─────────────────────────────────────────────────
  function updateStats() {
    if (isCodeMode()) {
      const lines = editor.value.split('\n').length;
      statsEl.textContent = `${lines.toLocaleString()} line${lines !== 1 ? 's' : ''} · ${editor.value.length.toLocaleString()} chars`;
      return;
    }
    const text = editor.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    statsEl.textContent = `${words.toLocaleString()} word${words !== 1 ? 's' : ''} · ${editor.value.length.toLocaleString()} chars`;
  }

  // ── Font ──────────────────────────────────────────────────
  // Some faces render visually smaller/larger at the same px — nudge the size to match
  const FONT_SIZE = { cursive: '1.4rem', handwriting: '1.35rem', rounded: '1.02rem' };
  function applyEditorFont(key) {
    if (isCodeMode()) return;   // code mode is always monospace at --code-size
    editor.style.fontFamily = FONTS[key] || FONTS.sans;
    editor.style.fontSize = FONT_SIZE[key] || '';   // '' → falls back to the CSS 1rem
  }
  document.getElementById('fontSelect').addEventListener('change', e => {
    applyEditorFont(e.target.value);
    localStorage.setItem('quillpad_font', e.target.value);
  });

  // ── Theme ─────────────────────────────────────────────────
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = document.body.dataset.theme === 'light' ? 'dark' : 'light';
    document.body.dataset.theme = next;
    localStorage.setItem('quillpad_theme', next);
    updateThemeIcon(next);
  });
  function updateThemeIcon(theme) {
    document.getElementById('themeIcon').innerHTML = theme === 'light'
      ? `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`
      : `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
  }

  // ── Undo history ──────────────────────────────────────────
  let undoStack = [];
  let lastTypeSnap = 0;
  function recordUndo() {
    const v = editor.value;
    if (undoStack.length && undoStack[undoStack.length - 1] === v) return;
    undoStack.push(v);
    if (undoStack.length > 200) undoStack.shift();
    refreshUndoBtn();
  }
  function refreshUndoBtn() {
    document.getElementById('undoBtn').disabled = undoStack.length === 0;
  }
  function undo() {
    if (!undoStack.length) return;
    let prev = undoStack.pop();
    if (prev === editor.value && undoStack.length) prev = undoStack.pop(); // skip a no-op snapshot
    editor.value = prev;
    saveActive(); updateStats(); updatePreview(); refreshUndoBtn();
    editor.focus();
  }
  // Snapshot before the user types (grouped by ~500ms pauses) so typing is undoable
  editor.addEventListener('beforeinput', () => {
    const now = performance.now();
    if (now - lastTypeSnap > 500) { recordUndo(); lastTypeSnap = now; }
  });

  // ── Markdown helpers ──────────────────────────────────────
  function wrapSelection(before, after) {
    recordUndo();
    const s = editor.selectionStart, e2 = editor.selectionEnd;
    const sel = editor.value.slice(s, e2);
    // Inline marks can't span line breaks — wrap each non-empty line on its own
    const wrapped = sel.includes('\n')
      ? sel.split('\n').map(l => l.trim() === '' ? l : before + l + after).join('\n')
      : before + sel + after;
    editor.setRangeText(wrapped, s, e2, 'select');
    editor.focus(); saveActive();
  }
  function insertPrefix(prefix) {
    recordUndo();
    const val = editor.value;
    const s = editor.selectionStart, e2 = editor.selectionEnd;
    const blockStart = val.lastIndexOf('\n', s - 1) + 1;
    // If the selection ends right at a line start, don't pull in the next (empty) line
    const endRef = (e2 > s && val[e2 - 1] === '\n') ? e2 - 1 : e2;
    let blockEnd = val.indexOf('\n', endRef);
    if (blockEnd === -1) blockEnd = val.length;
    const prefixed = val.slice(blockStart, blockEnd).split('\n').map(l => prefix + l).join('\n');
    editor.setRangeText(prefixed, blockStart, blockEnd, 'end');
    editor.setSelectionRange(blockStart, blockStart + prefixed.length);
    editor.focus(); saveActive();
  }
  function insertLink() {
    recordUndo();
    const s = editor.selectionStart, e2 = editor.selectionEnd;
    const sel = editor.value.slice(s, e2) || 'text';
    const md = `[${sel}](url)`;
    editor.setRangeText(md, s, e2, 'end');
    const urlStart = s + md.length - 4; // position of "url"
    editor.setSelectionRange(urlStart, urlStart + 3); // select the "url" placeholder
    editor.focus(); saveActive();
  }
  // ── Live Markdown preview ─────────────────────────────────
  function renderMarkdown(src) {
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Pull out fenced code blocks so their contents aren't parsed
    const blocks = [];
    src = src.replace(/```([\s\S]*?)```/g, (m, code) => {
      blocks.push(`<pre><code>${esc(code.replace(/^\n/, '').replace(/\n+$/, ''))}</code></pre>`);
      return `␀CB${blocks.length - 1}␀`;
    });

    const inline = t => {
      t = esc(t);
      t = t.replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>');   // allow underline tags
      t = t.replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`);
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      t = t.replace(/==([^=]+)==/g, '<mark>$1</mark>');
      t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      t = t.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
      t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) => `<a href="${encodeURI(url)}" target="_blank" rel="noopener">${txt}</a>`);
      return t;
    };

    const lines = src.split('\n');
    let html = '', inList = false;
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };

    for (let line of lines) {
      let m;
      if (/^␀CB\d+␀$/.test(line.trim())) { closeList(); html += blocks[+line.trim().match(/\d+/)[0]]; continue; }
      if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { closeList(); html += '<hr>'; continue; }
      if (m = line.match(/^(#{1,3})\s+(.*)$/)) { closeList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
      if (m = line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li class="task"><input type="checkbox" disabled ${m[1].toLowerCase() === 'x' ? 'checked' : ''}>${inline(m[2])}</li>`;
        continue;
      }
      if (m = line.match(/^\s*[-*]\s+(.*)$/)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${inline(m[1])}</li>`;
        continue;
      }
      closeList();
      if (m = line.match(/^\s*>\s?(.*)$/)) { html += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
      if (line.trim() === '') continue;
      html += `<p>${inline(line)}</p>`;
    }
    closeList();
    return html;
  }

  function updatePreview() {
    if (isCodeMode()) { renderGutterAndHighlight(); scheduleCodeOutput(); return; }
    if (!editorWrap.classList.contains('split')) return;
    previewPane.innerHTML = renderMarkdown(editor.value);
  }

  function setPreview(on) {
    editorWrap.classList.toggle('split', on);
    document.getElementById('previewToggle').classList.toggle('active-btn', on);
    localStorage.setItem('quillpad_preview', on ? '1' : '0');
    if (on) updatePreview();
  }

  document.getElementById('previewToggle').addEventListener('click', () => {
    setPreview(!editorWrap.classList.contains('split'));
  });

  // ── Code editor mode ──────────────────────────────────────
  const isCodeMode = () => document.body.classList.contains('code-mode');

  function currentNote() { return loadNotes().find(n => n.id === getActiveId()); }

  // hljs.highlightAuto guesses badly on short snippets (python→ruby, json→css),
  // so use explicit heuristics for the languages we care about.
  function detectLang(src) {
    const s = (src || '').trim();
    if (!s) return '';
    if (/^\s*<(!doctype|html|head|body|div|h[1-6]|p\b|span|section|main|nav|ul|ol|li|table|form|img|a\b|script|style)/i.test(s)
        || /<\/(div|p|body|html|span|h[1-6]|li|td|section)>/i.test(s)) return 'html';
    if (/^[\[{]/.test(s) && /[\]}]$/.test(s)) { try { JSON.parse(s); return 'json'; } catch {} }
    if (/^#!\s*\/\S*\b(ba|z)?sh\b/.test(s)
        || /^\s*(echo|ls|cd|grep|chmod|mkdir|curl|sudo|apt-get|brew|npm|git)\s+\S/m.test(s)) return 'bash';
    if (/^\s*(SELECT|INSERT\s+INTO|UPDATE|DELETE\s+FROM|CREATE\s+(TABLE|INDEX)|ALTER\s+TABLE|DROP\s+TABLE)\b/im.test(s)) return 'sql';
    if (/^\s*def\s+\w+\s*\(.*\)\s*:/m.test(s) || /^\s*class\s+\w+.*:\s*$/m.test(s)
        || /^\s*(from\s+[\w.]+\s+)?import\s+[\w.]+\s*$/m.test(s)) return 'python';
    if (/\b(function\s+\w*\s*\(|=>|const\s+\w+\s*=|let\s+\w+\s*=|var\s+\w+\s*=|console\.(log|error)|document\.|require\(|export\s+(default|const)|import\s+[\s\S]*\bfrom\b)/.test(s)) return 'javascript';
    if (/[^{}]+\{[^{}]*[a-z-]+\s*:\s*[^;{}]+;?[^{}]*\}/i.test(s)) return 'css';
    return '';
  }

  function activeLang() {
    const sel = langSelect.value;
    return sel === 'auto' ? detectLang(editor.value) : sel;
  }

  function renderGutterAndHighlight() {
    const src = editor.value;
    const count = src.split('\n').length;
    let nums = '';
    for (let i = 1; i <= count; i++) nums += i + '\n';
    gutter.textContent = nums;

    const lang = activeLang();
    let out;
    try {
      out = (lang && window.hljs.getLanguage(lang))
        ? window.hljs.highlight(src, { language: lang, ignoreIllegals: true }).value
        : escHtml(src);   // unknown language → plain, never mis-coloured
    } catch { out = escHtml(src); }
    // trailing newline keeps the last line's height in the <pre>
    hlCode.innerHTML = out + '\n';
    syncScroll();
  }

  function syncScroll() {
    hlLayer.scrollTop = editor.scrollTop;
    hlLayer.scrollLeft = editor.scrollLeft;
    gutter.scrollTop = editor.scrollTop;
  }
  editor.addEventListener('scroll', syncScroll);

  // Build a sandboxed document for the live output pane
  function buildSrcdoc(code, lang) {
    const l = (lang || '').toLowerCase();
    if (l === 'html' || l === 'xml' || (l === 'auto' && /<(!doctype|html|body|div|h[1-6]|p|section|span|style|script)\b/i.test(code))) return code;
    if (l === 'css') return `<style>${code}</style><div style="font:14px system-ui;padding:14px;color:#666">CSS loaded — add HTML to see it applied.</div>`;
    if (l === 'javascript' || l === 'json') {
      const safe = (l === 'json' ? `console.log(${code || 'null'})` : code).replace(/<\/script>/gi, '<\\/script>');
      return `<body style="font:12.5px ui-monospace,Menlo,monospace;padding:10px;white-space:pre-wrap;color:#222"><script>
        const _p=(...a)=>document.body.append(a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ')+'\\n');
        console.log=_p; console.info=_p; console.warn=_p; console.error=_p;
        window.onerror=(m)=>_p('Error: '+m);
        try{ ${safe} }catch(e){ _p('Error: '+e.message) }
      <\/script></body>`;
    }
    return code; // fall back to rendering as HTML
  }

  let codeOutTimer;
  function scheduleCodeOutput() {
    if (!editorWrap.classList.contains('split')) return;
    clearTimeout(codeOutTimer);
    codeOutTimer = setTimeout(() => {
      codeOutput.srcdoc = buildSrcdoc(editor.value, activeLang() || 'html');
    }, 400);
  }

  function applyMode(mode, lang) {
    const code = mode === 'code';
    document.body.classList.toggle('code-mode', code);
    const btn = document.getElementById('modeToggle');
    btn.classList.toggle('active-btn', code);
    btn.title = code ? 'Switch to notes' : 'Switch to code editor';
    document.getElementById('previewToggle').title = code ? 'Toggle live output' : 'Toggle live preview';
    langSelect.value = lang || 'auto';
    editor.placeholder = code ? 'Write some code…' : 'Start writing…';
    // No soft-wrap in code mode, so line numbers stay 1:1 with real lines
    editor.setAttribute('wrap', code ? 'off' : 'soft');
    // In code mode the font is always monospace; otherwise honour the font picker
    if (code) { editor.style.fontFamily = ''; editor.style.fontSize = ''; }
    else applyEditorFont(document.getElementById('fontSelect').value);
    if (!code) codeOutput.srcdoc = '';
    updateStats();
    updatePreview();
  }

  document.getElementById('modeToggle').addEventListener('click', () => {
    const notes = loadNotes();
    const idx = notes.findIndex(n => n.id === getActiveId());
    if (idx === -1) return;
    const next = notes[idx].mode === 'code' ? 'notes' : 'code';
    notes[idx].mode = next;
    saveNotes(notes);
    applyMode(next, notes[idx].lang);
    renderTree();
    showToast(next === 'code' ? 'Code editor mode.' : 'Notes mode.');
  });

  langSelect.addEventListener('change', () => {
    const notes = loadNotes();
    const idx = notes.findIndex(n => n.id === getActiveId());
    if (idx !== -1) { notes[idx].lang = langSelect.value; saveNotes(notes); }
    renderGutterAndHighlight();
    clearTimeout(codeOutTimer);
    scheduleCodeOutput();
  });

  editor.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
    if (mod && e.shiftKey && (e.key === 'x' || e.key === 'X')) { e.preventDefault(); wrapSelection('~~', '~~'); return; }
    if (mod && e.shiftKey && (e.key === 'h' || e.key === 'H')) { e.preventDefault(); wrapSelection('==', '=='); return; }
    if (mod && e.key === 'b') { e.preventDefault(); wrapSelection('**', '**'); }
    if (mod && e.key === 'i') { e.preventDefault(); wrapSelection('_', '_'); }
    if (mod && e.key === 'u') { e.preventDefault(); wrapSelection('<u>', '</u>'); }
    if (mod && e.key === 'e') { e.preventDefault(); wrapSelection('`', '`'); }
    if (mod && e.key === 'k') { e.preventDefault(); insertLink(); }
    if (e.key === 'Tab') { e.preventDefault(); editor.setRangeText('  ', editor.selectionStart, editor.selectionStart, 'end'); saveActive(); }
  });

  // ── Downloads ─────────────────────────────────────────────
  function getFilename(ext) {
    const base = (titleEl.value.trim() || 'note').replace(/\.[a-z0-9]{1,8}$/i, ''); // drop an extension typed in the title
    return (base.replace(/[^a-z0-9_\-\s]/gi, '').replace(/\s+/g, '-').toLowerCase() || 'note') + '.' + ext;
  }

  // Map the code language to a sensible file extension
  const LANG_EXT = { html: 'html', xml: 'xml', css: 'css', javascript: 'js', json: 'json', python: 'py', bash: 'sh', sql: 'sql', markdown: 'md' };
  function defaultExt() {
    if (!isCodeMode()) return 'md';
    return LANG_EXT[activeLang()] || 'txt';
  }
  // The note title drives the suggested filename; if it already has an extension, keep it
  function suggestedFilename() {
    const raw = (titleEl.value || '').trim();
    const clean = s => s.replace(/[\/\\:*?"<>|]/g, '-').trim();
    if (/\.[a-z0-9]{1,8}$/i.test(raw)) return clean(raw);
    const base = clean(raw).replace(/\s+/g, '-').toLowerCase() || 'untitled';
    return `${base}.${defaultExt()}`;
  }

  async function saveAs() {
    const content = editor.value;
    if (!content.trim()) { showToast('Nothing to save yet.'); return; }
    const suggested = suggestedFilename();

    // Native save dialog — lets the user edit the name/extension right there
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: suggested });
        const writable = await handle.createWritable();
        await writable.write(new Blob([content], { type: 'text/plain' }));
        await writable.close();
        showToast(`Saved as ${handle.name}`);
      } catch (err) {
        if (err.name !== 'AbortError') showToast('Could not save the file.');
      }
      return;
    }

    // Fallback (Safari/Firefox): ask for the filename in-page, then download
    const name = await promptDialog({
      title: 'Save as',
      message: 'Edit the file name and extension, then save.',
      value: suggested,
      confirmText: 'Save'
    });
    if (!name) return;
    triggerDownload(new Blob([content], { type: 'text/plain' }), name);
    showToast(`Downloaded as ${name}`);
  }
  function downloadAs(type) {
    if (!editor.value.trim()) { showToast('Nothing to download yet.'); return; }
    if (type === 'txt') triggerDownload(new Blob([editor.value], { type: 'text/plain' }), getFilename('txt'));
    else if (type === 'md') triggerDownload(new Blob([editor.value], { type: 'text/markdown' }), getFilename('md'));
    else if (type === 'pdf') { generatePDF(editor.value); return; }
    showToast(`Downloaded as ${getFilename(type)}`);
  }
  function triggerDownload(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
  }
  // Split a line of Markdown into styled runs (no nesting — good enough for notes)
  function mdInline(text) {
    const runs = [];
    const patterns = [
      { re: /^`([^`]+)`/,                     st: { code: true } },
      { re: /^\*\*([^*]+)\*\*/,               st: { b: true } },
      { re: /^~~([^~]+)~~/,                   st: { s: true } },
      { re: /^==([^=]+)==/,                   st: { hl: true } },
      { re: /^<u>([\s\S]*?)<\/u>/,            st: { u: true } },
      { re: /^\[([^\]]+)\]\(([^)\s]+)\)/,     st: { link: true } },
      { re: /^\*([^*\n]+)\*/,                 st: { i: true } },
      { re: /^_([^_\n]+)_/,                   st: { i: true } },
    ];
    let buf = '', i = 0;
    const flush = () => { if (buf) { runs.push({ t: buf }); buf = ''; } };
    while (i < text.length) {
      const sub = text.slice(i);
      let hit = null;
      for (const p of patterns) { const m = sub.match(p.re); if (m) { hit = { m, st: p.st }; break; } }
      if (hit) { flush(); runs.push(Object.assign({ t: hit.m[1] }, hit.st)); i += hit.m[0].length; }
      else { buf += text[i]; i++; }
    }
    flush();
    return runs;
  }

  function generatePDF(content) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const margin = 60, pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
    const maxW = pw - margin * 2;
    let y = margin;
    const ensure = need => { if (y + need > ph - margin) { doc.addPage(); y = margin; } };

    // Draw styled runs with word wrapping; hanging-indents to x0. Returns baseline y of last line.
    function drawRuns(runs, x0, size, lineH) {
      let x = x0;
      runs.forEach(run => {
        const style = run.b && run.i ? 'bolditalic' : run.b ? 'bold' : run.i ? 'italic' : 'normal';
        doc.setFont(run.code ? 'courier' : 'helvetica', style);
        doc.setFontSize(size);
        run.t.split(/(\s+)/).forEach(word => {
          if (!word) return;
          const isSpace = /^\s+$/.test(word);
          const w = doc.getTextWidth(word);
          if (x + w > x0 + (maxW - (x0 - margin)) && x > x0 + 0.1) { x = x0; y += lineH; ensure(lineH); }
          if (isSpace && x <= x0 + 0.1) return; // no leading space after a wrap
          if (word.trim()) {
            if (run.hl)   { doc.setFillColor(226, 220, 250); doc.rect(x, y - size * 0.78, w, size * 1.02, 'F'); }
            if (run.code) { doc.setFillColor(237, 237, 240); doc.rect(x - 1, y - size * 0.78, w + 2, size * 1.02, 'F'); }
          }
          doc.setTextColor(run.link ? 90 : 34, run.link ? 90 : 34, run.link ? 210 : 34);
          if (run.link) doc.setTextColor(70, 90, 210); else doc.setTextColor(34);
          doc.text(word, x, y);
          if (word.trim()) {
            if (run.s)            { doc.setDrawColor(90); doc.line(x, y - size * 0.28, x + w, y - size * 0.28); }
            if (run.u || run.link){ doc.setDrawColor(run.link ? 110 : 90); doc.line(x, y + 1.5, x + w, y + 1.5); }
          }
          x += w;
        });
      });
      doc.setTextColor(34); doc.setFont('helvetica', 'normal');
      return y;
    }

    const title = titleEl.value.trim();
    if (title) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(20);
      doc.splitTextToSize(title, maxW).forEach(l => { ensure(26); doc.text(l, margin, y); y += 24; });
      doc.setDrawColor(185); doc.line(margin, y - 6, pw - margin, y - 6); y += 16;
    }

    // Code notes are printed verbatim in monospace — no Markdown parsing
    if (isCodeMode()) {
      doc.setFont('courier', 'normal'); doc.setFontSize(9.5); doc.setTextColor(34);
      content.split('\n').forEach(line => {
        doc.splitTextToSize(line || ' ', maxW).forEach(w => { ensure(13); doc.text(w, margin, y); y += 13; });
      });
      doc.save(getFilename('pdf'));
      showToast(`Downloaded as ${getFilename('pdf')}`);
      return;
    }

    const lines = content.split('\n');
    let inCode = false;
    for (let raw of lines) {
      let m, line = raw;
      if (/^```/.test(line.trim())) { inCode = !inCode; y += 4; continue; }
      if (inCode) {
        doc.setFont('courier', 'normal'); doc.setFontSize(10); doc.setTextColor(45);
        doc.splitTextToSize(line || ' ', maxW - 16).forEach(w => {
          ensure(14); doc.setFillColor(241, 241, 243); doc.rect(margin, y - 10, maxW, 14, 'F'); doc.text(w, margin + 8, y); y += 14;
        });
        continue;
      }
      if (line.trim() === '') { y += 8; continue; }
      if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { ensure(18); y += 4; doc.setDrawColor(205); doc.line(margin, y, pw - margin, y); y += 14; continue; }
      if (m = line.match(/^(#{1,3})\s+(.*)$/)) {
        const size = [0, 17, 15, 13][m[1].length], lh = size * 1.4;
        ensure(lh + 8); y += 10;
        y = drawRuns(mdInline(m[2]).map(r => Object.assign(r, { b: true })), margin, size, lh);
        y += lh; continue;
      }
      if (m = line.match(/^\s*>\s?(.*)$/)) {
        const size = 11, lh = size * 1.5;
        ensure(lh); doc.setFillColor(201, 195, 236); doc.rect(margin, y - size * 0.8, 3, lh, 'F');
        doc.setTextColor(110);
        y = drawRuns(mdInline(m[1]).map(r => Object.assign(r, { i: true })), margin + 12, size, lh);
        y += lh; continue;
      }
      let prefix = '';
      if (m = line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/)) { prefix = m[1].toLowerCase() === 'x' ? '[x]  ' : '[ ]  '; line = m[2]; }
      else if (m = line.match(/^\s*[-*]\s+(.*)$/)) { prefix = '•  '; line = m[1]; }
      const size = 11, lh = size * 1.55;
      ensure(lh);
      let startX = margin;
      if (prefix) { doc.setFont('helvetica', 'normal'); doc.setFontSize(size); doc.setTextColor(34); doc.text(prefix, margin, y); startX = margin + doc.getTextWidth(prefix); }
      y = drawRuns(mdInline(line), startX, size, lh);
      y += lh;
    }

    doc.save(getFilename('pdf'));
    showToast(`Downloaded as ${getFilename('pdf')}`);
  }

  // ── Backup All ────────────────────────────────────────────
  document.getElementById('backupAllBtn').addEventListener('click', async () => {
    const notes = loadNotes();
    const folders = loadFolders();
    if (!notes.length) { showToast('No notes to backup.'); return; }

    const zip = new JSZip();
    const usedNames = {};

    function safeName(title, folder) {
      let base = (title || 'Untitled note').replace(/[^a-z0-9_\-\s]/gi, '').replace(/\s+/g, '-').toLowerCase();
      const key = (folder || '') + '/' + base;
      if (usedNames[key]) { usedNames[key]++; base += '-' + usedNames[key]; }
      else { usedNames[key] = 1; }
      return base + '.txt';
    }

    const folderMap = {};
    folders.forEach(f => { folderMap[f.id] = f.name || 'Untitled Folder'; });

    notes.forEach(note => {
      const content = note.content || '';
      if (note.folderId && folderMap[note.folderId]) {
        const folderName = folderMap[note.folderId].replace(/[^a-z0-9_\-\s]/gi, '').replace(/\s+/g, '-');
        zip.file(folderName + '/' + safeName(note.title, folderName), content);
      } else {
        zip.file(safeName(note.title, null), content);
      }
    });

    try {
      const blob = await zip.generateAsync({ type: 'blob' });
      const date = new Date().toISOString().slice(0, 10);
      triggerDownload(blob, `quillpad-backup-${date}.zip`);
      localStorage.setItem('quillpad_lastBackup', Date.now().toString());
      localStorage.removeItem('quillpad_bannerDismissedAt');
      updateBackupStatus();
      showToast(`Backup downloaded — ${notes.length} note${notes.length !== 1 ? 's' : ''}`);
    } catch (err) {
      showToast('Backup failed: ' + err.message);
    }
  });

  // ── Restore from backup ──────────────────────────────────
  document.getElementById('restoreBtn').addEventListener('click', () => {
    document.getElementById('restoreInput').click();
  });

  document.getElementById('restoreInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = ''; // allow re-uploading same file
    if (!files.length) return;

    try {
      const imported = await importFiles(files);
      if (imported.notes === 0) { showToast('No notes found in upload.'); return; }
      const folderMsg = imported.folders ? `, ${imported.folders} folder${imported.folders !== 1 ? 's' : ''}` : '';
      showToast(`Imported ${imported.notes} note${imported.notes !== 1 ? 's' : ''}${folderMsg}`);
    } catch (err) {
      showToast('Import failed: ' + err.message);
    }
  });

  async function importFiles(files) {
    const existingFolders = loadFolders();
    const existingNotes = loadNotes();
    let notesAdded = 0, foldersAdded = 0;

    // Build folder name lookup (case-insensitive) — reuse existing folders by name
    const folderByName = {};
    existingFolders.forEach(f => { folderByName[f.name.toLowerCase()] = f.id; });

    function ensureFolder(rawName) {
      const name = rawName.replace(/[\/\\]+/g, ' ').trim();
      if (!name) return null;
      const key = name.toLowerCase();
      if (folderByName[key]) return folderByName[key];
      const folder = { id: uid(), name, collapsed: false };
      existingFolders.push(folder);
      folderByName[key] = folder.id;
      foldersAdded++;
      return folder.id;
    }

    function addNote(title, content, folderId) {
      const note = {
        id: uid(),
        title: title || '',
        content: content || '',
        folderId: folderId || null,
        updatedAt: Date.now()
      };
      existingNotes.unshift(note);
      notesAdded++;
    }

    for (const file of files) {
      const name = file.name.toLowerCase();
      if (name.endsWith('.zip')) {
        const zip = await JSZip.loadAsync(file);
        // Sort so folders process consistently
        const entries = Object.values(zip.files).sort((a, b) => a.name.localeCompare(b.name));
        for (const entry of entries) {
          if (entry.dir) continue;
          // Only import text-like files
          const lower = entry.name.toLowerCase();
          if (!lower.endsWith('.txt') && !lower.endsWith('.md')) continue;
          const path = entry.name.split('/').filter(Boolean);
          const filename = path.pop();
          const folderPath = path.join(' / '); // collapse nested folders into one name
          const folderId = folderPath ? ensureFolder(folderPath) : null;
          const content = await entry.async('string');
          const title = filename.replace(/\.(txt|md)$/i, '').replace(/-/g, ' ');
          addNote(title, content, folderId);
        }
      } else if (name.endsWith('.txt') || name.endsWith('.md')) {
        const content = await file.text();
        const title = file.name.replace(/\.(txt|md)$/i, '').replace(/-/g, ' ');
        addNote(title, content, null);
      }
    }

    if (notesAdded > 0 || foldersAdded > 0) {
      saveFolders(existingFolders);
      saveNotes(existingNotes);
      renderTree();
      updateBackupStatus();
    }
    return { notes: notesAdded, folders: foldersAdded };
  }

  // ── Backup status indicator ──────────────────────────────
  function updateBackupStatus() {
    const dot = document.getElementById('backupDot');
    const btn = document.getElementById('backupAllBtn');
    const banner = document.getElementById('backupBanner');
    const bTitle = document.getElementById('backupBannerTitle');
    const bSub = document.getElementById('backupBannerSub');
    const footerDot = document.getElementById('lastBackupDot');
    const footerLabel = document.getElementById('lastBackupLabel');
    const footerWrap = document.getElementById('lastBackupText');
    if (!dot || !btn) return;

    const notes = loadNotes();
    const hasContent = notes.some(n => (n.title && n.title.trim()) || (n.content && n.content.trim()));
    const last = parseInt(localStorage.getItem('quillpad_lastBackup') || '0', 10);
    const dismissedAt = parseInt(localStorage.getItem('quillpad_bannerDismissedAt') || '0', 10);

    if (!hasContent) {
      dot.style.display = 'none';
      banner.classList.remove('visible');
      btn.title = 'Backup all notes (.zip)';
      if (footerWrap) footerWrap.style.display = 'none';
      return;
    }
    dot.style.display = '';
    if (footerWrap) footerWrap.style.display = '';

    let cls = 'fresh', label, footerText, days, hours;
    if (!last) {
      cls = 'danger';
      label = 'Never backed up';
      footerText = 'Never backed up';
    } else {
      days = Math.floor((Date.now() - last) / 86400000);
      const minutes = Math.floor((Date.now() - last) / 60000);
      hours = Math.floor((Date.now() - last) / 3600000);

      let ago;
      if (minutes < 1)      ago = 'just now';
      else if (minutes < 60) ago = `${minutes} min${minutes !== 1 ? 's' : ''} ago`;
      else if (hours < 24)   ago = `${hours} hour${hours !== 1 ? 's' : ''} ago`;
      else                   ago = `${days} day${days !== 1 ? 's' : ''} ago`;

      footerText = `Last backup: ${ago}`;

      if (hours < 24)      { cls = 'fresh';  label = `Last backup: ${ago}`; }
      else if (hours < 36) { cls = 'aging';  label = `Last backup: ${ago} — consider backing up`; }
      else if (hours < 48) { cls = 'stale';  label = `Last backup: ${ago} — back up soon`; }
      else                 { cls = 'danger'; label = `Last backup: ${ago} — back up now`; }
    }

    dot.className = 'backup-dot ' + cls;
    btn.title = label;
    if (footerDot)   footerDot.className = 'last-backup-dot ' + cls;
    if (footerLabel) footerLabel.textContent = footerText;
    if (footerWrap)  footerWrap.title = label === footerText ? 'Click to back up now' : label + ' · Click to back up now';

    // Banner: show on critical states unless dismissed within last 24h
    const dismissedRecently = dismissedAt && (Date.now() - dismissedAt) < 86400000;
    if ((cls === 'danger' || cls === 'stale') && !dismissedRecently) {
      banner.classList.add('visible');
      banner.classList.toggle('warn', cls === 'stale');
      if (!last) {
        bTitle.textContent = 'You haven\'t backed up yet';
        bSub.textContent = 'Notes only live in this browser. Clear cache = gone.';
      } else {
        const since = days >= 2 ? `${days} days` : `${hours} hours`;
        bTitle.textContent = `It's been ${since} since your last backup`;
        bSub.textContent = 'Click the download icon above to save a zip.';
      }
    } else {
      banner.classList.remove('visible');
    }
  }

  document.getElementById('backupBannerClose').addEventListener('click', () => {
    localStorage.setItem('quillpad_bannerDismissedAt', Date.now().toString());
    document.getElementById('backupBanner').classList.remove('visible');
  });

  document.getElementById('lastBackupText').addEventListener('click', () => {
    document.getElementById('backupAllBtn').click();
  });

  // ── Helpers ───────────────────────────────────────────────
  const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  function formatDate(ts) {
    const d = new Date(ts), now = new Date(), diff = (now - d) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400 && d.getDate() === now.getDate()) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    if (diff < 86400 * 7) return d.toLocaleDateString([], {weekday:'short'});
    return d.toLocaleDateString([], {month:'short', day:'numeric'});
  }
  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  // ── In-page modal (replaces window.confirm / window.prompt) ──
  const MODAL_ICONS = {
    trash: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`,
    save:  `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`
  };

  function modalDialog({ title = 'Are you sure?', message = '', confirmText = 'OK',
                         danger = true, icon = 'trash', withInput = false, value = '' } = {}) {
    const overlay = document.getElementById('modalOverlay');
    const confirmBtn = document.getElementById('modalConfirm');
    const cancelBtn = document.getElementById('modalCancel');
    const input = document.getElementById('modalInput');
    const iconEl = document.getElementById('modalIcon');
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    confirmBtn.textContent = confirmText;
    confirmBtn.classList.toggle('danger', danger);
    iconEl.classList.toggle('accent', icon !== 'trash');
    iconEl.innerHTML = MODAL_ICONS[icon] || MODAL_ICONS.trash;
    input.style.display = withInput ? '' : 'none';
    if (withInput) input.value = value;

    return new Promise(resolve => {
      const close = (result) => {
        overlay.classList.remove('show');
        confirmBtn.removeEventListener('click', onConfirm);
        cancelBtn.removeEventListener('click', onCancel);
        overlay.removeEventListener('mousedown', onBackdrop);
        document.removeEventListener('keydown', onKey);
        resolve(result);
      };
      const onConfirm = () => close(withInput ? (input.value.trim() || null) : true);
      const onCancel  = () => close(withInput ? null : false);
      const onBackdrop = e => { if (e.target === overlay) onCancel(); };
      const onKey = e => {
        if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
        if (e.key === 'Enter')  { e.preventDefault(); onConfirm(); }
      };
      confirmBtn.addEventListener('click', onConfirm);
      cancelBtn.addEventListener('click', onCancel);
      overlay.addEventListener('mousedown', onBackdrop);
      document.addEventListener('keydown', onKey);
      overlay.classList.add('show');
      if (withInput) {
        input.focus();
        // Pre-select just the base name so the extension is easy to keep
        const dot = input.value.lastIndexOf('.');
        input.setSelectionRange(0, dot > 0 ? dot : input.value.length);
      } else confirmBtn.focus();
    });
  }

  const confirmDialog = opts => modalDialog(Object.assign({ confirmText: 'Delete', danger: true, icon: 'trash' }, opts));
  const promptDialog  = opts => modalDialog(Object.assign({ confirmText: 'Save', danger: false, icon: 'save', withInput: true }, opts));

  function relativeTime(ts) {
    const mins = Math.floor((Date.now() - ts) / 60000);
    const hrs  = Math.floor((Date.now() - ts) / 3600000);
    const days = Math.floor((Date.now() - ts) / 86400000);
    if (mins < 1)  return 'just now';
    if (mins < 60) return `${mins} min${mins !== 1 ? 's' : ''} ago`;
    if (hrs < 24)  return `${hrs} hour${hrs !== 1 ? 's' : ''} ago`;
    return `${days} day${days !== 1 ? 's' : ''} ago`;
  }

  // ── Last-edit indicator (global — any note change) ─────────
  function updateLastEdit() {
    const wrap  = document.getElementById('lastEditText');
    const label = document.getElementById('lastEditLabel');
    if (!wrap || !label) return;
    const last = parseInt(localStorage.getItem('quillpad_lastEdit') || '0', 10);
    if (!last) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    label.textContent = `Last edit: ${relativeTime(last)}`;
    wrap.title = `Last edit: ${new Date(last).toLocaleString()}`;
  }

  // ── Boot ──────────────────────────────────────────────────
  function boot() {
    // Migrate legacy
    const legacyContent = localStorage.getItem('quillpad_content');
    const legacyTitle   = localStorage.getItem('quillpad_title');
    let notes = loadNotes();
    if (!notes.length) {
      const note = { id: uid(), title: legacyTitle || '', content: legacyContent || '', folderId: null, updatedAt: Date.now() };
      notes = [note]; saveNotes(notes, true);
      localStorage.removeItem('quillpad_content');
      localStorage.removeItem('quillpad_title');
    }
    // Ensure folderId field on older notes
    let dirty = false;
    notes.forEach(n => { if (!('folderId' in n)) { n.folderId = null; dirty = true; } });
    if (dirty) saveNotes(notes, true);

    let activeId = getActiveId();
    if (!activeId || !notes.find(n => n.id === activeId)) {
      activeId = [...notes].sort((a, b) => b.updatedAt - a.updatedAt)[0].id;
      setActiveId(activeId);
    }

    const theme = localStorage.getItem('quillpad_theme') || 'dark';
    document.body.dataset.theme = theme; updateThemeIcon(theme);
    const font = FONTS[localStorage.getItem('quillpad_font')] ? localStorage.getItem('quillpad_font') : 'sans';
    document.getElementById('fontSelect').value = font;
    applyEditorFont(font);

    // Live preview: remembers the user's choice; defaults off on phones (too narrow to split)
    const prevPref = localStorage.getItem('quillpad_preview');
    setPreview(prevPref === null ? !isMobile() : prevPref !== '0');

    // The sidebar is a slide-over on phones — start closed so the editor is visible
    if (isMobile()) setSidebar(false);

    renderTree();
    switchNote(activeId);
    updateBackupStatus();
    updateLastEdit();
    if (window.matchMedia('(hover: hover)').matches) initTooltips();  // no hover on touch
    // Re-check status every minute so the "X mins ago" counters stay accurate
    setInterval(() => { updateBackupStatus(); updateLastEdit(); }, 60 * 1000);
  }

  // ── Faint hover tooltips (styled, reads each element's title) ──
  function initTooltips() {
    const tip = document.createElement('div');
    tip.className = 'tooltip';
    document.body.appendChild(tip);
    let active = null;

    function place(el) {
      const r = el.getBoundingClientRect();
      tip.style.visibility = 'hidden'; tip.classList.add('show');
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let top = r.bottom + 8;
      if (top + th > window.innerHeight - 4) top = r.top - th - 8;
      let left = r.left + r.width / 2 - tw / 2;
      left = Math.max(6, Math.min(left, window.innerWidth - tw - 6));
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
      tip.style.visibility = '';
    }
    function show(el) {
      const text = el.getAttribute('title');
      if (!text) return;
      active = el;
      el.setAttribute('data-tip', text);
      el.removeAttribute('title');       // suppress the native tooltip
      tip.textContent = text;
      place(el);
    }
    function hide(el) {
      if (el.hasAttribute('data-tip')) { el.setAttribute('title', el.getAttribute('data-tip')); el.removeAttribute('data-tip'); }
      if (active === el) active = null;
      tip.classList.remove('show');
    }
    document.addEventListener('mouseover', e => {
      const el = e.target.closest('[title]');
      if (el && el !== active) show(el);
    });
    document.addEventListener('mouseout', e => {
      const el = e.target.closest('[data-tip]');
      if (el && (!e.relatedTarget || !el.contains(e.relatedTarget))) hide(el);
    });
    // Never leave a tooltip stranded after a click
    document.addEventListener('click', () => { if (active) hide(active); }, true);
  }

  boot();
</script>
</body>
</html>
